# ==============================================================================
# General Settings
# ==============================================================================
set -g default-terminal "tmux-256color"
# True colour, hyperlinks, and coloured undercurls (Neovim LSP diagnostics)
set -as terminal-features ",*:RGB:hyperlinks:usstyle"

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -s extended-keys-format csi-u
set -s escape-time 10                     # Faster command sequences
set -g repeat-time 600                    # Increase repeat timeout
set -s set-clipboard on                   # Rely on OSC 52 for system clipboard
set -g mouse on                           # Enable mouse support
set -g history-limit 50000                # Increase scrollback buffer size
set -g display-time 4000                  # Increase tmux messages display duration
set -g display-panes-time 800             # Slightly shorter pane indicators display time (default 1000)
set -g status-interval 20                 # Clock only shows minutes; also throttles continuum's save check (not 15: sensible resets the default to 5)
set -g focus-events on                    # Focus events enabled for terminals that support them
set -g aggressive-resize on               # Super useful when using "grouped sessions" and multi-monitor setup
set -gq allow-passthrough on              # Allow image rendering / passthrough

# ==============================================================================
# Window & Pane Management
# ==============================================================================
set -g base-index 1                       # Start windows numbering at 1
set -g pane-base-index 1                  # Make pane numbering consistent with windows
set -g renumber-windows on                # Renumber windows when a window is closed
set -g set-titles on                      # Set terminal title
set -g monitor-activity on                # Monitor for activity in windows
set -g detach-on-destroy off              # Don't exit from tmux when closing a session

# ==============================================================================
# Key Bindings
# ==============================================================================
# Prefix Setup
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split Panes (now preserving current directory)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# Kill Panes/Sessions
unbind x
bind x kill-pane                          # Rebind to just "close" without prompt
bind X kill-session                       # Kill entire session (<prefix> + Shift + X)

# Window/Session Navigation
unbind n # DEFAULT: Move to next window
unbind w # DEFAULT: change current window interactively
bind n command-prompt "rename-session '%%'"
bind w new-window -c "#{pane_current_path}"
bind W choose-window

# Resize Panes with Vim movement keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ==============================================================================
# Copy Mode & Vim Navigation
# ==============================================================================
set -g mode-keys vi

bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'C-v' send -X rectangle-toggle # Visual block mode
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel # Exit after yanking
bind-key -T copy-mode-vi 'Space' send -X halfpage-down
bind-key -T copy-mode-vi 'Bspace' send -X halfpage-up

# Moving between panes with Vim movement keys (Seamless Vim/Tmux navigation)
# Match the pane's foreground command in tmux itself instead of running ps + grep
# fzf is included so C-j/C-k move its selection instead of switching panes
is_vim="#{m/ri:^(g?n?vim?x?|view|fzf)(diff)?$,#{pane_current_command}}"

bind-key -n 'C-h' if-shell -F "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell -F "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell -F "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell -F "$is_vim" 'send-keys C-l' 'select-pane -R'
bind C-l send-keys C-l                    # Restore clear-screen (<prefix> + C-l)

bind-key 'C-n' 'select-window -n'
bind-key 'C-p' 'select-window -p'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-n' select-window -n
bind-key -T copy-mode-vi 'C-p' select-window -p


# ==============================================================================
# Plugins Configuration (FZF, Fuzzback, Catppuccin)
# ==============================================================================
# Fuzzback
set -g @fuzzback-popup 1
set -g @fuzzback-bind S

# tmux-fzf
TMUX_FZF_LAUNCH_KEY="f"
TMUX_FZF_OPTIONS="-p -w 62% -h 38% -m"

# Resurrect
set -g @resurrect-capture-pane-contents 'on'
# Reopen nvim with its persistence.nvim session for the pane's cwd
# ([[...]] is a Lua string, avoiding nested quotes through resurrect's eval)
set -g @resurrect-processes "\"nvim->nvim '+lua require[[persistence]].load()'\""

# Continuum (auto-save every 15 min, auto-restore on server start)
set -g @continuum-restore 'on'

# Catppuccin Theme & Status Bar
# Move the status bar to the top
set -g status-position top
# Center the window list alignment (Note the British spelling: "centre")
set -g status-justify centre
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_text " #W"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_date_time}"

# ==============================================================================
# Plugins (tpack)
# ==============================================================================
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'roosta/tmux-fuzzback'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum' # Keep last: hooks into status-right

# Initialize tpack (keep this line at the very bottom of tmux.conf)
run 'tpack init'
